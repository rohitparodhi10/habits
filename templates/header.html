{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://play-lh.googleusercontent.com/7cwJD9wRKPu1xnSomH7UI0ICAXT_lJt7JAJa76Nut0oYH__b2XvjaUUpJHQhhx41roA" type="image/png">
  <style>
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      align-items: center;
      padding: 12px;
      box-sizing: border-box;
      background-color: rgb(128, 173, 255);
      box-shadow: 0 0 4px rgb(88, 90, 90);
    }

    header ul {
      margin: 0;
      padding: 0;
      list-style-type: none;
      overflow: hidden;
    }

    header li {
      display: inline-block;
      padding-left: 45px;
    }

    header li:first-child {
      font-family: cursive;
      font-size: 18px;
      font-weight: bold;
    }

    header li a {
      color: black;
      text-decoration: none;
      padding: 14px;
      transition: 0.3s ease;
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-weight: 300;
      font-size: 16px;
    }

    header li a:hover {
      color: rgb(4, 58, 160);
    }

    body {
      background-color: antiquewhite;
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    .float-right {
      float: right;
    }

    
    .page-content {
      padding-top: 70px;
    }
  </style>
  <title>Header</title>
</head>
<body>
  <header>
    <ul>
      <li>Habit Tracker</li>
      <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
      <li><a href="{% url 'show' %}">Profile</a></li>
      <li><a href="{% url 'history' %}">History</a></li>

      {% if user.is_authenticated %}
        <li class="float-right"><a href="{% url 'login' %}">Logout</a></li>
      {% endif %}
    </ul>
  </header>
</body>
</html>
