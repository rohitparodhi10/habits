{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration - Habit Tracker</title>
  <link rel="icon" href="https://play-lh.googleusercontent.com/7cwJD9wRKPu1xnSomH7UI0ICAXT_lJt7JAJa76Nut0oYH__b2XvjaUUpJHQhhx41roA" type="image/png">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #244FAC;
    }

    input[type="email"],
    input[type="number"], 
    input[type="password"] {
      width: 100%;
      max-width: 380px;
      padding: 0.75rem;
      margin: 0.5rem 0 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: rgb(51, 121, 252);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: rgb(36, 83, 172);
    }

    .links {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }

    .links a {
      color: rgb(21, 101, 248);
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register</h2>
    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}
      <input type="email" name="email" placeholder="Email" required />
      <input type="number" name="mobile" placeholder="Mobile Number" required>
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Sign Up</button>
    </form>
    <div class="links">
      <a href="{% url 'login' %}">Already have an account?</a>
    </div>
  </div>
</body>
</html>
