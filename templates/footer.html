<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Footer - Habit Tracker</title>
  <link rel="icon" href="https://play-lh.googleusercontent.com/7cwJD9wRKPu1xnSomH7UI0ICAXT_lJt7JAJa76Nut0oYH__b2XvjaUUpJHQhhx41roA" type="image/png"/>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    body {
      min-height: 100vh;
    }
    main {
      flex: 1;
    }
    footer {
      color: #000;
      background: linear-gradient(to bottom, #4183fd, #9bbdfc);
      padding: 10px 60px;
      font-family: Arial, sans-serif;
      text-align: center;
      font-size: 14px;
    }
    footer a {
      color: inherit;
      text-decoration: underline;
    }
    footer p:last-child {
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main>

  </main>

  <footer>
    <p>© 2025 HabitTrack. Build better habits, one day at a time.</p>
    <p>Contact us: <a href="mailto:support@habittrack.app">support@habittrack.app</a></p>
    <p>Made with ❤️ by Kajal Borse, Nehali Shinde, Rohit Parodhi, Mayur Kale</p>
  </footer>
</body>
</html>
