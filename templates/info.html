{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Info</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #f5f7fa, #c3cfe2);
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 100px auto 30px;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 30px;
    }

    form input, form select {
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    form button {
      padding: 10px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      max-width: 350px;
    }

    form button:hover {
      background-color: #3367d6;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: center;
    }

    th {
      background-color: #e3f2fd;
    }

    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    form button {
    grid-column: span 2;
    padding: 5px 10px;
    background-color: #4285f4;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    width: 100px; 
    margin: 0 auto;
    }


    @media (max-width: 600px) {
      form {
        grid-template-columns: 1fr;
      }

      form button {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>User Information Form</h2>

    <form method="POST">
      {% csrf_token %}
      <input type="text" name="fullname" placeholder="Full Name" required />
      <input type="number" name="age" placeholder="Age" required />
      <input type="number" name="height" step="0.1" placeholder="Height (cm)" required />
      <input type="number" name="weight" step="0.1" placeholder="Weight (kg)" required />
      <select name="working" required>
        <option value="" disabled selected>Select Working Status</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
      <input type="number" name="working_hours" placeholder="Working Hours/Day" required />

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
