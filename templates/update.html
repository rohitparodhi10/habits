<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update Habit</title>
<style>
  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    margin: 0; padding: 0;
  }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #2c2c2c;
  }
  .container {
    background: #fff;
    padding: 35px 40px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    max-width: 480px;
    width: 100%;
    transition: transform 0.3s ease;
  }
  .container:hover {
    transform: translateY(-6px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.35);
  }
  h2 {
    font-weight: 800;
    font-size: 2.2rem;
    text-align: center;
    margin-bottom: 30px;
    color: #4a148c;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  label {
    font-weight: 600;
    color: #4a148c;
  }
  input, select {
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #ddd;
    border-radius: 12px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    outline-offset: 2px;
  }
  input:focus, select:focus {
    border-color: #7e57c2;
    box-shadow: 0 0 8px #9575cdaa;
    outline: none;
    background: #fafaff;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-size: 1.2rem;
    padding: 14px;
    color: #fff;
    font-weight: 700;
    background: linear-gradient(45deg, #7b1fa2, #9c27b0);
    box-shadow: 0 8px 15px rgba(156, 39, 176, 0.4);
    transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
  }
  button:hover {
    background: linear-gradient(45deg, #9c27b0, #7b1fa2);
    box-shadow: 0 12px 20px rgba(156, 39, 176, 0.7);
    transform: translateY(-3px);
  }
  button:active {
    transform: translateY(1px);
    box-shadow: 0 5px 10px rgba(156, 39, 176, 0.3);
  }
  @media (max-width: 520px) {
    .container {
      padding: 25px 20px;
    }
    h2 {
      font-size: 1.8rem;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Update Habit</h2>
    <form method="POST" class="habit-form">
      {% csrf_token %}
      
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" value="{{ habit.name }}" required />

      <label for="habit_type">Type:</label>
      <select id="habit_type" name="habit_type" required>
        <option value="Good" {% if habit.habit_type == 'Good' %}selected{% endif %}>Good</option>
        <option value="Bad" {% if habit.habit_type == 'Bad' %}selected{% endif %}>Bad</option>
      </select>

      <label for="frequency">Frequency:</label>
      <input type="text" id="frequency" name="frequency" value="{{ habit.frequency }}" required />

      <label for="start_date">Start Date:</label>
      <input type="date" id="start_date" name="start_date" value="{{ habit.start_date|date:'Y-m-d' }}" />

      <label for="end_date">End Date:</label>
      <input type="date" id="end_date" name="end_date" value="{{ habit.end_date|date:'Y-m-d' }}" />

      <label for="is_active">Is Active:</label>
      <select id="is_active" name="is_active" required>
        <option value="True" {% if habit.is_active %}selected{% endif %}>Yes</option>
        <option value="False" {% if not habit.is_active %}selected{% endif %}>No</option>
      </select>

      <button type="submit" class="btn primary-btn">Update</button>
    </form>
  </div>
</body>
</html>
